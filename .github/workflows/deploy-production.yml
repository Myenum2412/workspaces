name: Deploy Production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DO_DOMAIN: "workspaceapi.myenum.in"

jobs:
  # ── Lint + Type Check ────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type check
        working-directory: ./backend
        run: npm run typecheck

      - name: Lint
        working-directory: ./backend
        run: npm run lint

  # ── Tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://localhost:27017/workspace_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long!!!
        run: npm run test

  # ── Deploy ────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          timeout: 300s
          script: |
            set -euo pipefail
            cd /opt/workspaces
            bash deploy/deploy-production.sh "${{ github.sha }}" "${{ github.actor }}"

      - name: Health Check
        run: |
          echo "Waiting 15s for service to start..."
          sleep 15
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://${{ env.DO_DOMAIN }}/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/12 — status $STATUS, waiting 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 60s"
          exit 1

  # ── Purge Cloudflare Cache ───────────────────────────────────
  purge-cache:
    name: Purge Cloudflare Cache
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Purge Cloudflare cache
        run: |
          RESPONSE=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}')
          echo "Cloudflare response: $RESPONSE"
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Cloudflare cache purge failed"
            exit 1
          fi
          echo "✅ Cloudflare cache purged"

  # ── Notify ────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, purge-cache]
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy.result == 'success' && needs.purge-cache.result == 'success'
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              --data '{
                "embeds": [{
                  "title": "✅ Production Deploy Successful",
                  "description": "Commit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nDomain: ${{ env.DO_DOMAIN }}",
                  "color": 3066993,
                  "timestamp": "${{ github.event.head_commit.timestamp }}"
                }]
              }' || true
          fi

      - name: Notify failure
        if: needs.deploy.result == 'failure' || needs.purge-cache.result == 'failure'
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              --data '{
                "embeds": [{
                  "title": "❌ Production Deploy Failed",
                  "description": "Commit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": 15158332,
                  "timestamp": "${{ github.event.head_commit.timestamp }}"
                }]
              }' || true
          fi
