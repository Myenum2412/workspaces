name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/docker-compose.production.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            cd /opt/workspaces

            # Pull latest code
            git pull origin main

            # Rebuild and restart backend
            docker compose \
              -f deploy/docker-compose.production.yml \
              --env-file .env \
              up -d --build backend

            # Restart cloudflared to pick up any env changes
            docker compose \
              -f deploy/docker-compose.production.yml \
              --env-file .env \
              up -d --force-recreate cloudflared

            # Clean up old images
            docker system prune -f --filter "until=24h"

      - name: Health Check
        run: |
          sleep 10
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DO_DOMAIN }}/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "Attempt $i/5 — status $STATUS, waiting..."
            sleep 5
          done
          echo "❌ Backend health check failed"
          exit 1
