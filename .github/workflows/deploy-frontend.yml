name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  # ── Lint ─────────────────────────────────────────────────────
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

  # ── Build & Deploy ───────────────────────────────────────────
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: https://workspaceapi.myenum.in
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=workspaces-frontend
          workingDirectory: ./frontend

  # ── Purge Cache ──────────────────────────────────────────────
  purge-cache:
    name: Purge Cloudflare Cache
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Purge Cloudflare cache
        run: |
          RESPONSE=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}')
          echo "Cloudflare response: $RESPONSE"
          SUCCESS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Cloudflare cache purge failed"
            exit 1
          fi
          echo "✅ Cloudflare cache purged"

  # ── Notify ────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, purge-cache]
    if: always()

    steps:
      - name: Notify frontend result
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            STATUS="${{ needs.deploy.result }}"
            COLOR=$([ "$STATUS" = "success" ] && echo "3066993" || echo "15158332")
            EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              --data "{
                \"embeds\": [{
                  \"title\": \"$EMOJI Frontend Deploy $STATUS\",
                  \"description\": \"Commit: \`${{ github.sha }}\`\nAuthor: ${{ github.actor }}\",
                  \"color\": $COLOR
                }]
              }" || true
          fi
