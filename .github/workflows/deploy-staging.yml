name: Deploy Staging

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ── Lint + Type Check ────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type check
        working-directory: ./backend
        run: npm run typecheck

      - name: Lint
        working-directory: ./backend
        run: npm run lint

  # ── Tests ────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://localhost:27017/workspace_staging_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-min-32-chars-long!!!
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-long!!!
        run: npm run test

  # ── Deploy Staging ───────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: staging
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script_stop: true
          timeout: 300s
          script: |
            set -euo pipefail
            cd /opt/workspaces
            export STAGING=true
            bash deploy/deploy-production.sh "${{ github.sha }}" "${{ github.actor }}"

      - name: Health Check (Staging)
        run: |
          echo "Waiting 15s for staging service..."
          sleep 15
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://${{ secrets.DO_HOST }}:4001/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/12 — status $STATUS, waiting 5s..."
            sleep 5
          done
          echo "❌ Staging health check failed after 60s"
          exit 1

  # ── Notify ────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Notify staging result
        run: |
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            STATUS="${{ needs.deploy.result }}"
            COLOR=$([ "$STATUS" = "success" ] && echo "3066993" || echo "15158332")
            EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              --data "{
                \"embeds\": [{
                  \"title\": \"$EMOJI Staging Deploy $STATUS\",
                  \"description\": \"Branch: develop\nCommit: \`${{ github.sha }}\`\nAuthor: ${{ github.actor }}\",
                  \"color\": $COLOR
                }]
              }" || true
          fi
