info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "companyName": "Acme Inc",
        "companyRange": "1-10",
        "email": "john@acme.com",
        "category": "Software"
      }

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
