info:
  name: Verify Email
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/auth/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "john@acme.com"
      }

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
