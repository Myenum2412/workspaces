info:
  name: Change Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "currentPassword": "old-password",
        "newPassword": "new-password"
      }

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
