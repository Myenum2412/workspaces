info:
  name: DB Proxy - List Documents
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/db"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "method": "listDocuments",
        "collectionId": "user_profiles",
        "queries": []
      }

settings:
  encodeUrl: true
  timeout: 15000
  followRedirects: true
  maxRedirects: 5
