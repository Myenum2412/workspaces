services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    depends_on:
      - mongodb

  # Cloudflare Tunnel — exposes backend via trycloudflare.com (ephemeral)
  # For permanent tunnel, use deploy/docker-compose.production.yml
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://backend:4000 --no-autoupdate
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:4000
    depends_on:
      - backend

volumes:
  mongo_data:
