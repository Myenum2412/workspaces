# ═══════════════════════════════════════════════════════════════
# Production Docker Compose — workspaceapi.myenum.in
# Usage: docker compose -f deploy/docker-compose.production.yml --env-file .env up -d
# ═══════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    image: workspace-api:${GIT_SHA:-latest}
    container_name: workspace-api
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - upload_data:/app/uploads
      - ../logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: workspace-cloudflared
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file:
      - ../.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  upload_data:
